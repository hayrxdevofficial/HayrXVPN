name: Build HayrXVPN IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive app
        run: |
          xcodebuild archive \
            -project HayrXVPN.xcodeproj \
            -scheme HayrXVPN \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/HayrXVPN.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Package IPA
        run: |
          mkdir -p ./build/Payload
          cp -r ./build/HayrXVPN.xcarchive/Products/Applications/HayrXVPN.app ./build/Payload/
          cd ./build
          zip -r HayrXVPN.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HayrXVPN-unsigned-ipa
          path: ./build/HayrXVPN.ipa
          retention-days: 30
