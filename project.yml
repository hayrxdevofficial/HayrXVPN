name: HayrXVPN

options:
  bundleIdPrefix: com.hayrxvpn
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

# 👇 ОБЪЯВЛЕНИЕ ПАКЕТА (на уровне всего проекта)
packages:
  SwiftyXrayKit:
    url: https://github.com/dima-u/SwiftyXrayKit
    from: 1.1.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  # ═══════════════════════════════════════════
  # Основное приложение
  # ═══════════════════════════════════════════
  HayrXVPN:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: HayrXVPN
        PRODUCT_BUNDLE_IDENTIFIER: com.hayrxvpn.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HayrXVPN.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: HayrXVPNTunnel
        embed: true

  # ═══════════════════════════════════════════
  # VPN-расширение
  # ═══════════════════════════════════════════
  HayrXVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: VPNTunnelExtension
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: HayrXVPNTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.hayrxvpn.ios.tunnel
        INFOPLIST_FILE: VPNTunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: VPNTunnelExtension/HayrXVPNTunnel.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    # 👇 ЭТА ЗАВИСИМОСТЬ БЫЛА ПРОПУЩЕНА — ИЗ-ЗА НЕЁ ОШИБКА "XrayBridge not found"
    dependencies:
      - package: SwiftyXrayKit
        product: SwiftyXrayKit
